<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>analytics/sheet preview via qlik/embed-web-components</title>
    <link rel="stylesheet" href="index.css">
    <script crossorigin="anonymous" type="application/javascript"
        src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
        data-host="https://{{qlikHost}}" data-client-id="{{qlikClientId}}" data-access-code="{{qlikAccessCode}}"
        data-auth-type="anonymous"></script>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>analytics/sheet preview via qlik/embed-web-components</h1>
            <p><a href="./" aria-label="Back to catalog">&lt; back to catalog</a></p>
        </div>
        <div class="qlik-container">
            <qlik-embed id="analyticsSheetPreview" ui="analytics/sheet" app-id="{{qlikAppId}}"
                sheet-id="7dd685d5-529e-41ea-bbd5-87b4c0dbbf9f" preview="true"></qlik-embed>
        </div>
    </div>
</body>

</html>
