<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Analytics Chart with Patch Overrides</title>
    <link rel="stylesheet" href="index.css">
    <script crossorigin="anonymous" type="application/javascript"
        src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
        data-host="https://{{qlikHost}}" data-client-id="{{qlikClientId}}" data-access-code="{{qlikAccessCode}}"
        data-auth-type="anonymous"></script>
    <style>
        .controls-box {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-radius: 4px;
            width: 80vw;
        }
        .control-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .control-label {
            font-weight: 600;
            color: #323130;
            min-width: 100px;
        }
        .control-input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        .apply-button {
            padding: 0.5rem 1.5rem;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        .apply-button:hover {
            background-color: #106ebe;
        }
        .apply-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .clear-button {
            padding: 0.5rem 1.5rem;
            background-color: #d83b01;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        .clear-button:hover {
            background-color: #c73601;
        }
        .clear-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>Solo Analytics Chart with Patch Overrides</h1>
            <p><a href="./" aria-label="Back to catalog">&lt; back to catalog</a></p>
        </div>

        <!-- Controls for patching -->
        <div class="controls-box">
            <div class="control-group">
                <label class="control-label" for="chartTitle">Chart Title:</label>
                <input type="text" id="chartTitle" class="control-input" value="Hello, world." placeholder="Hello, world.">
                <button id="applyButton" class="apply-button" disabled>Apply Patch</button>
                <button id="clearButton" class="clear-button" disabled>Clear Soft Patches</button>
            </div>
        </div>

        <!-- Selection Bar -->
        <div style="width: 80vw; margin-bottom: 1.5rem;">
            <qlik-embed id="selectionsEmbed" ui="analytics/selections" 
                app-id="{{qlikAppId}}" 
                style="width: 100%; height: 100%;">
            </qlik-embed>
        </div>

        <!-- Chart -->
        <div style="width: 80vw; height: 500px;">
            <qlik-embed id="chart" ui="analytics/chart" 
                app-id="{{qlikAppId}}" 
                style="width: 100%; height: 100%;">
            </qlik-embed>
        </div>
    </div>

    <script type="module">
        // Global variables
        let doc = null;
        let objectId = null;
        let objectHandle = null;
        let originalTitle = null;

        // Main function to initialize chart
        async function initializeChart() {
            try {
                console.log('Waiting for Qlik components to load...');
                
                // Wait for the selections embed to be ready
                const selectionsElement = document.getElementById('selectionsEmbed');
                await new Promise((resolve) => {
                    const checkReady = setInterval(() => {
                        if (selectionsElement && typeof selectionsElement.getRefApi === 'function') {
                            clearInterval(checkReady);
                            resolve();
                        }
                    }, 100);
                });

                console.log('Connecting to Qlik app...');
                
                // Get the Ref API and document
                const refApi = await selectionsElement.getRefApi();
                doc = await refApi.getDoc();
                
                console.log('Getting app objects...');
                
                // Get all objects from the app
                const objects = await doc.getAllInfos();
                
                // Find a bar chart object
                const vizObject = objects.find(obj => 
                    obj.qType === 'barchart'
                );

                if (!vizObject) {
                    throw new Error('No bar chart found in the app');
                }

                objectId = vizObject.qId;
                console.log(`Found bar chart: ${objectId}`);

                // Display the chart
                const chartElement = document.getElementById('chart');
                chartElement.setAttribute('object-id', objectId);
                
                // Get object handle for patching
                objectHandle = await doc.getObject(objectId);
                
                // Get current properties to read the original title
                const properties = await objectHandle.getProperties();
                originalTitle = properties.qMetaDef?.title || properties.title || 'Hello, world.';
                
                // Update the input field with the chart's default title
                const titleInput = document.getElementById('chartTitle');
                titleInput.value = originalTitle;
                
                console.log(`Chart loaded successfully! Original title: "${originalTitle}"`);
                
                // Enable the apply and clear buttons
                document.getElementById('applyButton').disabled = false;
                document.getElementById('clearButton').disabled = false;

            } catch (error) {
                console.error('Error initializing chart:', error);
            }
        }

        // Function to clear soft patches
        async function clearSoftPatches() {
            try {
                if (!objectHandle) {
                    console.warn('Object handle not available');
                    return;
                }

                console.log('Clearing soft patches...');
                
                // Disable button while clearing
                document.getElementById('clearButton').disabled = true;
                
                // Clear soft patches
                await objectHandle.clearSoftPatches();
                
                // Reset the input field to the original title
                const titleInput = document.getElementById('chartTitle');
                const properties = await objectHandle.getProperties();
                const currentTitle = properties.qMetaDef?.title || properties.title || 'Hello, world.';
                titleInput.value = currentTitle;
                originalTitle = currentTitle;
                
                console.log('✓ Soft patches cleared');
                
                // Re-enable button
                document.getElementById('clearButton').disabled = false;

            } catch (error) {
                console.error('Error clearing soft patches:', error);
                document.getElementById('clearButton').disabled = false;
            }
        }

        // Function to apply title patch
        async function applyTitlePatch() {
            try {
                const newTitle = document.getElementById('chartTitle').value.trim();
                
                if (!newTitle) {
                    console.warn('Please enter a title');
                    return;
                }

                console.log(`Applying patch to update title to: "${newTitle}"`);
                
                // Disable button while applying
                document.getElementById('applyButton').disabled = true;
                
                // Create patch to update title
                const patches = [
                    {
                        qOp: 'replace',
                        qPath: '/title',
                        qValue: JSON.stringify(newTitle)
                    }
                ];

                // Apply the patch
                await objectHandle.applyPatches(patches, true);
                
                // Update originalTitle to reflect the new state
                originalTitle = newTitle;
                
                console.log(`✓ Title updated to: "${newTitle}"`);
                
                // Re-enable button
                document.getElementById('applyButton').disabled = false;

            } catch (error) {
                console.error('Error applying patch:', error);
                document.getElementById('applyButton').disabled = false;
            }
        }

        // Setup event listeners
        document.getElementById('applyButton').addEventListener('click', applyTitlePatch);
        document.getElementById('clearButton').addEventListener('click', clearSoftPatches);
        
        // Allow Enter key to apply
        document.getElementById('chartTitle').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('applyButton').disabled) {
                applyTitlePatch();
            }
        });

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeChart);
        } else {
            initializeChart();
        }
    </script>
</body>

</html>
