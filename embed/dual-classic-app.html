<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>classic/app via qlik/embed-web-components and qlik/api</title>
  <link rel="stylesheet" href="index.css">
  <script type="importmap">
  {
    "imports": {
      "@qlik/embed-web-components": "https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js",
      "@qlik/api": "https://cdn.jsdelivr.net/npm/@qlik/api@1/index.js"
    }
  }
</script>
  <script type="module">
    import "@qlik/embed-web-components"
    import { auth } from "@qlik/api";

    auth.registerHostConfig("anon", {
      host: "https://{{qlikHost}}",
      authType: "anonymous",
      clientId: "{{qlikClientId}}",
      accessCode: "{{qlikAccessCode}}",
    });

  </script>
</head>

<body>
  <div class="main-container">
    <div class="header">
      <h1>classic/app via qlik/embed-web-components and qlik/api</h1>
      <p><a href="./" aria-label="Back to catalog">&lt; back to catalog</a></p>
    </div>
    <div class="qlik-container">
      <qlik-embed id="classicApp" ui="classic/app" app-id="{{qlikAppId}}" sheet-id="7dd685d5-529e-41ea-bbd5-87b4c0dbbf9f" host-config="anon" />
    </div>
  </div>
</body>

<script type="module">
  const classicApp = document.getElementById('classicApp');

  classicApp.addEventListener('qlik-embed:ready', () => {
    console.log('qlik-embed:ready');
  });

  classicApp.addEventListener('qlik-embed:sheet-changed', (event) => {
    console.log('qlik-embed:sheet-changed', event.detail);
  });

  classicApp.addEventListener('qlik-embed:sheet-ready', (event) => {
    console.log('qlik-embed:sheet-ready', event.detail);
  });
</script>

</html>
