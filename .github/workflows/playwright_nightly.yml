name: Playwright - nightly visual regression

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2:00 AM UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Browsers ship pre-installed in this image, matching the pinned playwright
    # version in package.json/package-lock.json — keep both in sync when bumping.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure visual.spec.ts-snapshots directory exists
        run: mkdir -p tests/visual.spec.ts-snapshots
      - name: Install Playwright dependencies
        run: npm ci
      - name: Start app server
        env:
          QLIK_HOST: ${{ vars.QLIK_HOST }}
          QLIK_CLIENT_ID: ${{ vars.QLIK_CLIENT_ID }}
          QLIK_ACCESS_CODE: ${{ vars.QLIK_ACCESS_CODE }}
          QLIK_APP_ID: ${{ vars.QLIK_APP_ID }}
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Server did not become ready in time"
          exit 1
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          # Tests use expect(...).toMatchSnapshot('<name>.png'), so Playwright names
          # failure files `<name>-actual.png`/`<name>-expected.png`/`<name>-diff.png`
          # (never the bare `actual.png`/etc.), inside per-test folders under
          # test-results/ whose names don't follow a fixed "visual-Visual-regression-*"
          # prefix. Upload the whole directories rather than brittle glob patterns.
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
      - name: Upload visual regression summary
        if: always()
        run: |
          {
            echo "## Nightly visual regression triage"
            echo ""
            echo "- Workflow run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Job status: ${{ job.status }}"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "### Failure summary"
              echo "- Visual regression failed."
              echo "- Download the \`visual-regression-artifacts\` artifact from this run."
              echo "- Check delta images inside \`test-results/\` (files named \`<name>-diff.png\`, with matching \`<name>-actual.png\` and \`<name>-expected.png\`)."
            else
              echo "### Result"
              echo "- Visual regression passed."
              echo "- Any generated visual artifacts (if present) are still available in \`visual-regression-artifacts\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
