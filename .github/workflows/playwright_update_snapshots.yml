name: Playwright - update snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    # Browsers ship pre-installed in this image, matching the pinned playwright
    # version in package.json/package-lock.json — keep both in sync when bumping.
    container:
      image: mcr.microsoft.com/playwright:v1.53.2-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure visual.spec.ts-snapshots directory exists
        run: mkdir -p tests/visual.spec.ts-snapshots

      - name: Install dependencies
        run: npm ci

      - name: Start app server
        env:
          QLIK_HOST: ${{ vars.QLIK_HOST }}
          QLIK_CLIENT_ID: ${{ vars.QLIK_CLIENT_ID }}
          QLIK_ACCESS_CODE: ${{ vars.QLIK_ACCESS_CODE }}
          QLIK_APP_ID: ${{ vars.QLIK_APP_ID }}
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Server did not become ready in time"
          exit 1

      - name: Run Playwright tests in all browsers
        run: npx playwright test --project=chromium --project=firefox --project=webkit --update-snapshots

      - name: Commit and force push changes to update-snapshots branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin update-snapshots || true
          git checkout -B update-snapshots
          git add tests/*
          git commit -m "chore: update test snapshots" || echo "No changes to commit"
          git push --force origin update-snapshots
